<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>Gym Log</title>
  <meta name="description" content="Plan your trainings, then log them in as few taps as possible." />

  <!-- PWA / iOS home-screen -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0b0b0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gym" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Icons: one 24px line set, so every icon sits on the same centre -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20V12M12 20V5M19 20v-9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"/><circle cx="16" cy="7" r="2.5"/><circle cx="10" cy="17" r="2.5"/></g></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 7V4.5h4V7M6.5 7l1 12.5h9l1-12.5M10 11v5M14 11v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-again" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M5 3.5v4h4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8.5 5.5v13M15.5 5.5v13" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-skip" viewBox="0 0 24 24"><path d="M5 6l8 6-8 6zM18 6v12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
      <symbol id="i-timer" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="13.5" r="7"/><path d="M12 13.5V10M10 3h4"/></g></symbol>
      <symbol id="i-weight" viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
      <symbol id="flag-fr" viewBox="0 0 30 30"><clipPath id="cf"><circle cx="15" cy="15" r="15"/></clipPath><g clip-path="url(#cf)"><rect width="10" height="30" fill="#0055a4"/><rect x="10" width="10" height="30" fill="#fff"/><rect x="20" width="10" height="30" fill="#ef4135"/></g></symbol>
      <symbol id="flag-en" viewBox="0 0 30 30"><clipPath id="ce"><circle cx="15" cy="15" r="15"/></clipPath><g clip-path="url(#ce)"><rect width="30" height="30" fill="#012169"/><path d="M0 0l30 30M30 0L0 30" stroke="#fff" stroke-width="6"/><path d="M0 0l30 30M30 0L0 30" stroke="#c8102e" stroke-width="2"/><path d="M15 0v30M0 15h30" stroke="#fff" stroke-width="10"/><path d="M15 0v30M0 15h30" stroke="#c8102e" stroke-width="6"/></g></symbol>
    </defs>
  </svg>

  <!-- Home: your trainings -->
  <section id="screen-home" class="screen active">
    <header class="topbar wide">
      <button id="go-history" class="icon-btn" data-i18n-aria="history"><svg class="ic"><use href="#i-chart"/></svg></button>
      <span class="progress" data-i18n="gym"></span>
      <span class="side">
        <button id="lang" class="icon-btn lang" type="button"><svg class="flag" aria-hidden="true"><use id="lang-use" href="#flag-en"/></svg></button>
        <button id="go-settings" class="icon-btn" data-i18n-aria="settings"><svg class="ic"><use href="#i-sliders"/></svg></button>
      </span>
    </header>
    <div class="scroll">
      <button id="resume" class="resume" type="button" hidden>
        <span class="resume-ic"><svg class="ic"><use href="#i-play"/></svg></span>
        <span class="resume-main"><b id="resume-name"></b><span id="resume-clock"></span></span>
      </button>
      <div id="tr-list" class="card-list"></div>
      <button id="new-tr" class="add-card" type="button" data-i18n-aria="newTr"><svg class="ic"><use href="#i-plus"/></svg></button>
    </div>
  </section>

  <!-- Plan: the exercises of one training. Nothing is timed here. -->
  <section id="screen-plan" class="screen">
    <header class="topbar">
      <button id="plan-back" class="icon-btn" data-i18n-aria="back"><svg class="ic"><use href="#i-back"/></svg></button>
      <button id="plan-name" class="title-btn" type="button"></button>
      <button id="plan-del" class="icon-btn del" data-i18n-aria="del"><svg class="ic"><use href="#i-trash"/></svg></button>
    </header>
    <div class="scroll">
      <div id="plan-list" class="card-list"></div>
      <button id="plan-add" class="add-card" type="button" data-i18n-aria="addEx"><svg class="ic"><use href="#i-plus"/></svg></button>
    </div>
    <div class="bottom-bar">
      <button id="plan-start" class="btn primary wide icon-only" type="button" data-i18n-aria="start"><svg class="ic lg"><use href="#i-play"/></svg></button>
    </div>
  </section>

  <!-- Pick an exercise: body part + name -->
  <section id="screen-pick" class="screen">
    <header class="topbar">
      <button id="pick-back" class="icon-btn" data-i18n-aria="back"><svg class="ic"><use href="#i-back"/></svg></button>
      <span class="progress" data-i18n="addEx"></span>
      <span></span>
    </header>
    <div class="scroll pick">
      <div id="parts" class="chips scroll-x"></div>
      <div class="name-row">
        <input id="ex-name" class="field" type="text" enterkeyhint="next" autocomplete="off" autocapitalize="sentences" data-i18n-ph="exName" />
        <button id="name-next" class="btn primary icon-only sq" type="button" data-i18n-aria="next" hidden><svg class="ic"><use href="#i-next"/></svg></button>
      </div>
      <div id="suggest" class="suggest-list"></div>
    </div>
  </section>

  <!-- The wheel: every value of an exercise on one screen -->
  <section id="screen-wheel" class="screen">
    <header class="topbar wide">
      <button id="wheel-back" class="icon-btn" data-i18n-aria="back"><svg class="ic"><use href="#i-back"/></svg></button>
      <span class="wheel-title"><span id="wheel-name"></span><button id="wheel-part" class="part-tag" type="button"></button></span>
      <span class="side">
        <button id="wheel-kind" class="icon-btn" type="button" data-i18n-aria="kind"><svg class="ic"><use id="wheel-kind-use" href="#i-weight"/></svg></button>
        <button id="wheel-del" class="icon-btn del" data-i18n-aria="remove" hidden><svg class="ic"><use href="#i-trash"/></svg></button>
      </span>
    </header>

    <div class="wheel-body">
      <div id="fields" class="fields"></div>

      <div id="wheel" class="wheel">
        <div class="dial">
          <svg viewBox="0 0 300 300" aria-hidden="true">
            <defs>
              <linearGradient id="wg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#7c6cf6"/><stop offset="1" stop-color="#8b5cf6"/>
              </linearGradient>
            </defs>
            <circle cx="150" cy="150" r="128" class="w-track"/>
            <circle id="w-lap" cx="150" cy="150" r="128" class="w-lap"/>
            <circle id="w-arc" cx="150" cy="150" r="128" class="w-arc"/>
            <g id="w-ticks"></g>
            <circle id="w-last" cx="150" cy="22" r="5" class="w-last"/>
            <circle id="w-thumb" cx="150" cy="22" r="15" class="w-thumb"/>
          </svg>
          <button id="w-center" class="w-center" type="button" data-i18n-aria="type">
            <span id="w-value" class="w-value">0</span>
            <span id="w-unit" class="w-unit"></span>
            <span id="w-note" class="w-note"></span>
          </button>
          <input id="w-input" class="w-input" type="text" inputmode="decimal" enterkeyhint="done" hidden />
        </div>
      </div>

      <div id="presets" class="chips presets"></div>
      <button id="wheel-go" class="btn primary wide icon-only" type="button"><svg class="ic lg"><use id="wheel-go-use" href="#i-next"/></svg></button>
    </div>
  </section>

  <!-- Do: one exercise at a time, full screen -->
  <section id="screen-do" class="screen">
    <header class="topbar wide">
      <button id="do-min" class="icon-btn" data-i18n-aria="minimize"><svg class="ic"><use href="#i-down"/></svg></button>
      <div id="do-steps" class="steps"></div>
      <span class="side">
        <span id="do-clock" class="mini-clock"></span>
        <button id="do-list" class="icon-btn" data-i18n-aria="overview"><svg class="ic"><use href="#i-list"/></svg></button>
      </span>
    </header>

    <!-- the exercise -->
    <div id="do-ex" class="do-ex">
      <div class="do-head">
        <div id="do-name" class="do-name"></div>
        <span id="do-part" class="part-tag"></span>
      </div>
      <button id="do-big" class="do-big" type="button" data-i18n-aria="edit"></button>
      <div id="do-sub" class="do-sub"></div>
      <div class="do-actions">
        <span class="do-side"></span>
        <button id="do-main" class="do-main" type="button"></button>
        <span class="do-side"><button id="do-done" class="do-done" type="button" data-i18n-aria="setDone" hidden><svg class="ic lg"><use href="#i-check"/></svg></button></span>
      </div>
    </div>

    <!-- rest: the whole screen is the countdown -->
    <div id="do-rest" class="do-rest" hidden>
      <div class="rest-dial">
        <svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="90" class="rr-track"/><circle id="rest-arc" cx="100" cy="100" r="90" class="rr-arc"/></svg>
        <div class="rest-center">
          <div id="rest-time" class="rest-time">1:30</div>
          <div id="rest-next" class="rest-next"></div>
        </div>
      </div>
      <div class="rest-btns">
        <button id="rest-minus" class="round-btn" type="button">−15</button>
        <button id="rest-skip" class="round-btn big" type="button" data-i18n-aria="skip"><svg class="ic lg"><use href="#i-skip"/></svg></button>
        <button id="rest-plus" class="round-btn" type="button">+15</button>
      </div>
    </div>

    <!-- every set done -->
    <div id="do-end" class="do-end" hidden>
      <div class="check"><svg class="ic big"><use href="#i-check"/></svg></div>
      <div id="do-stats" class="done-stats"></div>
      <button id="do-finish" class="btn primary wide" type="button" data-i18n="finish"></button>
    </div>
  </section>

  <!-- Overview while doing: jump, add, finish -->
  <div id="sheet-over" class="sheet" hidden>
    <div class="sheet-card">
      <div id="over-list" class="over-list"></div>
      <div class="row">
        <button id="over-add" class="btn grow icon-only" type="button" data-i18n-aria="addEx"><svg class="ic"><use href="#i-plus"/></svg></button>
        <button id="over-finish" class="btn grow finish-btn" type="button" data-i18n="finish"></button>
      </div>
    </div>
  </div>

  <!-- History -->
  <section id="screen-history" class="screen">
    <header class="topbar">
      <button id="hist-back" class="icon-btn" data-i18n-aria="back"><svg class="ic"><use href="#i-back"/></svg></button>
      <span class="progress" data-i18n="history"></span>
      <span></span>
    </header>
    <div id="hist-list" class="scroll"></div>
  </section>

  <!-- Settings -->
  <section id="screen-settings" class="screen">
    <header class="topbar">
      <button id="set-back" class="icon-btn" data-i18n-aria="back"><svg class="ic"><use href="#i-back"/></svg></button>
      <span class="progress" data-i18n="settings"></span>
      <span></span>
    </header>
    <div class="scroll">
      <button id="opt-sound" class="opt" type="button"><span data-i18n="sound"></span><i class="tog"></i></button>
      <button id="opt-awake" class="opt" type="button"><span data-i18n="awake"></span><i class="tog"></i></button>
      <p class="hint small-hint" data-i18n="dataHint"></p>
      <div class="row">
        <button id="export" class="btn grow" type="button" data-i18n="export"></button>
        <button id="import" class="btn grow" type="button" data-i18n="import"></button>
      </div>
      <input id="import-file" type="file" accept="application/json,.json" hidden />
      <button id="wipe" class="btn ghost small wide danger-txt" type="button" data-i18n="wipe"></button>
    </div>
  </section>

  <!-- Name prompt (rename a training) -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card">
      <input id="sheet-input" class="field" type="text" enterkeyhint="done" autocomplete="off" autocapitalize="words" data-i18n-ph="nameTplPh" />
      <div class="row">
        <button id="sheet-cancel" class="btn ghost grow icon-only" type="button" data-i18n-aria="cancel"><svg class="ic"><use href="#i-x"/></svg></button>
        <button id="sheet-ok" class="btn primary grow icon-only" type="button" data-i18n-aria="save"><svg class="ic"><use href="#i-check"/></svg></button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" hidden><span id="toast-msg"></span><button id="toast-act" class="toast-act" type="button" hidden></button></div>

  <script src="js/app.js"></script>
</body>
</html>
