<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>Gym Log</title>
  <meta name="description" content="Log gym sets in as few taps as possible." />

  <!-- PWA / iOS home-screen -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0b0b0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gym" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Icons: one 24px line set, so every icon sits on the same centre -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20V12M12 20V5M19 20v-9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"/><circle cx="16" cy="7" r="2.5"/><circle cx="10" cy="17" r="2.5"/></g></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 7V4.5h4V7M6.5 7l1 12.5h9l1-12.5M10 11v5M14 11v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.8l2.5 5.2 5.7.7-4.2 3.9 1.1 5.6L12 16.5l-5.1 2.7 1.1-5.6-4.2-3.9 5.7-.7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-again" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M5 3.5v4h4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
      <symbol id="flag-fr" viewBox="0 0 30 30"><clipPath id="cf"><circle cx="15" cy="15" r="15"/></clipPath><g clip-path="url(#cf)"><rect width="10" height="30" fill="#0055a4"/><rect x="10" width="10" height="30" fill="#fff"/><rect x="20" width="10" height="30" fill="#ef4135"/></g></symbol>
      <symbol id="flag-en" viewBox="0 0 30 30"><clipPath id="ce"><circle cx="15" cy="15" r="15"/></clipPath><g clip-path="url(#ce)"><rect width="30" height="30" fill="#012169"/><path d="M0 0l30 30M30 0L0 30" stroke="#fff" stroke-width="6"/><path d="M0 0l30 30M30 0L0 30" stroke="#c8102e" stroke-width="2"/><path d="M15 0v30M0 15h30" stroke="#fff" stroke-width="10"/><path d="M15 0v30M0 15h30" stroke="#c8102e" stroke-width="6"/></g></symbol>
    </defs>
  </svg>

  <!-- Home: start a workout, or the workout in progress -->
  <section id="screen-home" class="screen active">
    <header class="topbar wide">
      <button id="go-history" class="icon-btn" data-i18n-aria="history"><svg class="ic" aria-hidden="true"><use href="#i-chart"/></svg></button>
      <span id="clock" class="progress"></span>
      <span class="side">
        <button id="lang" class="icon-btn lang" type="button"><svg class="flag" aria-hidden="true"><use id="lang-use" href="#flag-en"/></svg></button>
        <button id="go-settings" class="icon-btn" data-i18n-aria="settings"><svg class="ic" aria-hidden="true"><use href="#i-sliders"/></svg></button>
      </span>
    </header>

    <!-- no workout running -->
    <div id="home-idle" class="scroll">
      <div class="hero">
        <div class="brand"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg></div>
        <h1 class="title" data-i18n="ready"></h1>
        <p id="idle-sub" class="hint center"></p>
      </div>
      <button id="start-empty" class="btn primary wide" data-i18n="start"></button>
      <div id="tpl-wrap">
        <div class="section-label" data-i18n="trainings"></div>
        <div id="tpl-list" class="card-list"></div>
      </div>
    </div>

    <!-- workout running -->
    <div id="home-active" class="scroll" hidden>
      <div id="ex-list" class="card-list"></div>
      <button id="add-ex" class="add-ex" type="button"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg><span data-i18n="addEx"></span></button>
      <div class="row finish-row">
        <button id="save-tpl" class="btn ghost small with-ic" type="button"><svg class="ic" aria-hidden="true"><use href="#i-star"/></svg><span data-i18n="saveTpl"></span></button>
        <button id="finish" class="btn finish-btn" type="button" data-i18n="finish"></button>
      </div>
    </div>

    <!-- rest countdown, floats above the list -->
    <div id="rest" class="rest" hidden>
      <svg class="rest-ring" viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" class="rr-track"/><circle id="rest-arc" cx="22" cy="22" r="19" class="rr-arc"/></svg>
      <div class="rest-main">
        <div id="rest-time" class="rest-time">1:30</div>
        <div id="rest-label" class="rest-label"></div>
      </div>
      <button id="rest-minus" class="rest-btn" type="button">−15</button>
      <button id="rest-plus" class="rest-btn" type="button">+15</button>
      <button id="rest-skip" class="rest-btn skip" type="button" data-i18n="skip"></button>
    </div>
  </section>

  <!-- Pick an exercise: body part + name -->
  <section id="screen-pick" class="screen">
    <header class="topbar">
      <button id="pick-back" class="icon-btn" data-i18n-aria="back"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg></button>
      <span class="progress" data-i18n="addEx"></span>
      <span></span>
    </header>
    <div class="scroll pick">
      <div id="parts" class="chips scroll-x"></div>
      <div class="name-row">
        <input id="ex-name" class="field" type="text" enterkeyhint="next" autocomplete="off" autocapitalize="sentences" data-i18n-ph="exName" />
        <button id="name-next" class="btn primary" type="button" data-i18n="next" hidden></button>
      </div>
      <div id="suggest" class="suggest-list"></div>
    </div>
  </section>

  <!-- The wheel: weight, reps, sets, rest on one screen -->
  <section id="screen-wheel" class="screen">
    <header class="topbar">
      <button id="wheel-back" class="icon-btn" data-i18n-aria="back"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg></button>
      <span class="wheel-title"><span id="wheel-name"></span><button id="wheel-part" class="part-tag" type="button"></button></span>
      <span class="side"><button id="wheel-del" class="icon-btn del" data-i18n-aria="remove" hidden><svg class="ic" aria-hidden="true"><use href="#i-trash"/></svg></button></span>
    </header>

    <div class="wheel-body">
      <div id="fields" class="fields">
        <button class="fcell" data-f="kg"><span class="fl" data-i18n="f_kg"></span><b data-v="kg"></b></button>
        <button class="fcell" data-f="reps"><span class="fl" data-i18n="f_reps"></span><b data-v="reps"></b></button>
        <button class="fcell" data-f="sets"><span class="fl" data-i18n="f_sets"></span><b data-v="sets"></b></button>
        <button class="fcell" data-f="rest"><span class="fl" data-i18n="f_rest"></span><b data-v="rest"></b></button>
      </div>

      <div id="wheel" class="wheel">
        <div class="dial">
        <svg viewBox="0 0 300 300" aria-hidden="true">
          <defs>
            <linearGradient id="wg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#7c6cf6"/><stop offset="1" stop-color="#8b5cf6"/>
            </linearGradient>
          </defs>
          <circle cx="150" cy="150" r="128" class="w-track"/>
          <circle id="w-lap" cx="150" cy="150" r="128" class="w-lap"/>
          <circle id="w-arc" cx="150" cy="150" r="128" class="w-arc"/>
          <g id="w-ticks"></g>
          <circle id="w-last" cx="150" cy="22" r="5" class="w-last"/>
          <circle id="w-thumb" cx="150" cy="22" r="15" class="w-thumb"/>
        </svg>
        <button id="w-center" class="w-center" type="button" data-i18n-aria="type">
          <span id="w-value" class="w-value">0</span>
          <span id="w-unit" class="w-unit">kg</span>
          <span id="w-note" class="w-note"></span>
        </button>
        <input id="w-input" class="w-input" type="text" inputmode="decimal" enterkeyhint="done" hidden />
        </div>
      </div>

      <div id="presets" class="chips presets"></div>
      <button id="wheel-go" class="btn primary wide"></button>
    </div>
  </section>

  <!-- Workout finished -->
  <section id="screen-done" class="screen pad">
    <div class="stack center">
      <div class="check"><svg class="ic big" aria-hidden="true"><use href="#i-check"/></svg></div>
      <div class="saved-amount" data-i18n="saved"></div>
      <div id="done-stats" class="done-stats"></div>
      <button id="done-tpl" class="btn wide with-ic" type="button"><svg class="ic" aria-hidden="true"><use href="#i-star"/></svg><span data-i18n="saveTpl"></span></button>
      <button id="done-ok" class="btn primary wide" type="button" data-i18n="done"></button>
    </div>
  </section>

  <!-- History -->
  <section id="screen-history" class="screen">
    <header class="topbar">
      <button id="hist-back" class="icon-btn" data-i18n-aria="back"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg></button>
      <span class="progress" data-i18n="history"></span>
      <span></span>
    </header>
    <div id="hist-list" class="scroll"></div>
  </section>

  <!-- Settings -->
  <section id="screen-settings" class="screen">
    <header class="topbar">
      <button id="set-back" class="icon-btn" data-i18n-aria="back"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg></button>
      <span class="progress" data-i18n="settings"></span>
      <span></span>
    </header>
    <div class="scroll">
      <div class="section-label" data-i18n="feel"></div>
      <button id="opt-sound" class="opt" type="button"><span><span data-i18n="sound"></span><small data-i18n="soundSub"></small></span><i class="tog"></i></button>
      <button id="opt-awake" class="opt" type="button"><span><span data-i18n="awake"></span><small data-i18n="awakeSub"></small></span><i class="tog"></i></button>

      <div class="section-label" data-i18n="data"></div>
      <p class="hint small-hint" data-i18n="dataHint"></p>
      <div class="row">
        <button id="export" class="btn grow" type="button" data-i18n="export"></button>
        <button id="import" class="btn grow" type="button" data-i18n="import"></button>
      </div>
      <input id="import-file" type="file" accept="application/json,.json" hidden />
      <button id="wipe" class="btn ghost small wide danger-txt" type="button" data-i18n="wipe"></button>
    </div>
  </section>

  <!-- Name prompt (save as training) -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card">
      <div class="section-label" data-i18n="nameTpl"></div>
      <input id="sheet-input" class="field" type="text" enterkeyhint="done" autocomplete="off" autocapitalize="words" data-i18n-ph="nameTplPh" />
      <div class="row">
        <button id="sheet-cancel" class="btn ghost grow" type="button" data-i18n="cancel"></button>
        <button id="sheet-ok" class="btn primary grow" type="button" data-i18n="save"></button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" hidden><span id="toast-msg"></span><button id="toast-act" class="toast-act" type="button" hidden></button></div>

  <script src="js/app.js"></script>
</body>
</html>
